<!doctype html>
<meta charset="utf-8">
<title>关卡预览 · 原资源回放</title>
<style>
  body { margin: 0; overflow: hidden; background: #161a19; color: #f5f2e9; font: 15px "Microsoft YaHei", sans-serif; }
  #view { position: relative; height: 100vh; display: flex; flex-direction: column; }
  #stage { flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  footer { display: flex; flex: none; gap: 12px; padding: 12px; align-items: center; }
  .replay-fullscreen canvas { object-fit: fill; }
  .replay-fullscreen footer { position: absolute; inset: auto 0 0; background: rgba(22, 26, 25, .82); }
  button, select { padding: 5px 12px; }
  input { flex: 1; min-width: 0; }
  output { font-variant-numeric: tabular-nums; }
</style>
<div id="view">
  <div id="stage"></div>
  <footer>
    <button id="play" disabled>播放</button>
    <select id="speed" aria-label="播放倍速" disabled>
      <option value="1">1×</option>
      <option value="2" selected>2×</option>
    </select>
    <input id="time" type="range" min="0" max="20" step="0.01" value="0" aria-label="关卡时间" disabled>
    <output id="stamp">0.00 秒</output>
    <span>正在载入关卡资源…</span>
  </footer>
</div>
<script src="pixi.min.js"></script>
<script src="pixi-spine.umd.js"></script>
<script type="importmap">{"imports":{"three":"./three/three.module.js"}}</script>
<script type="module" src="scene.js"></script>
