[project]
name = "arknights-unpacker-gui"
version = "0.1.10"
description = "Arknights PC resource explorer, unpacker and offline operator reports"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6==6.8.3",
  "UnityPy==1.25.3",
  "flatbuffers==25.12.19",
  "Pillow==11.3.0",
  "numpy==2.2.6",
  "pycryptodome==3.23.0",
  "bson==0.5.10",
  "lz4==4.4.5",
  "spine-asset==1.1.1",
  "WannaCRI==0.3.3",
  "ffmpeg-python==0.2.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-qt==4.5.0", "pyinstaller==6.16.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arknights_unpacker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["local: requires the installed Arknights PC resources"]

