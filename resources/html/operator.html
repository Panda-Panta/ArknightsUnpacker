<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>$title</title>
  <style>$css</style>
</head>
<body>
  <div class="page-bar"><span class="brand">ARKNIGHTS</span><span>本地资料档案</span></div>
  <div class="shell">
    <aside aria-label="资料目录">
      <div class="directory-heading">资料目录 <span>CONTENTS</span></div>
      <nav><ol>$directory</ol></nav>
      <p class="directory-note">本地快照 · 离线阅读</p>
    </aside>
    <main>
      $header
      <div class="report-tools js-only" role="search" aria-label="搜索资料">
        <div class="toolbar">
          <label for="report-search">页面搜索</label>
          <input type="search" id="report-search" placeholder="搜索技能、模组或正文" autocomplete="off">
          <button id="clear-search" type="button">清除搜索</button>
          <div class="toolbar-actions">
            <button id="expand-all" type="button">展开全部</button>
            <button id="collapse-all" type="button">收起全部</button>
            <button id="print-report" type="button">打印</button>
          </div>
        </div>
        <p id="search-status" class="search-status" role="status" aria-live="polite">可搜索正文，或在技能与模组分区切换内容。</p>
      </div>
      <noscript><p class="reading-note">当前未启用脚本，以下完整列出所有技能与模组等级；可使用浏览器的页面查找。</p></noscript>
      <div id="search-empty" class="empty-state" hidden>没有找到匹配内容，请修改关键词或清除搜索。</div>
      $content
      <footer>资料来自本地游戏快照。PRTS作为资料组织与视觉参考，具体版本与来源见“资料版本与口径”。</footer>
    </main>
  </div>
  <script>$script</script>
</body>
</html>
